name: Robot CTA

on:
  schedule:
    - cron: "*/30 * * * *"     # mode guides seulement (ManyChat gère les commentaires)
  workflow_dispatch:
    inputs:
      test:
        description: "1 = test sans rien envoyer"
        default: "0"
      cutoff:
        description: "ne traiter que les commentaires avant cette date (ex 2026-11-09T19:00:00+0000)"
        default: ""
      rattrapage:
        description: "1 = envoie seulement les guides en retard puis s'arrête"
        default: "0"

concurrency:
  group: cta
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Robot CTA (boucle toutes les 15 s)
        env:
          IG_TOKEN_CTA: ${{ secrets.IG_TOKEN_CTA }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ github.event.inputs.test || '0' }}
          CUTOFF: ${{ github.event.inputs.cutoff || '' }}
          RATTRAPAGE: ${{ github.event.inputs.rattrapage || (github.event_name == 'schedule' && '1') || '0' }}
        run: python cta.py
