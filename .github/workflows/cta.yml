name: Robot CTA

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths: [cta.py, cta.json, sonde.py, .github/workflows/cta.yml]
  workflow_dispatch:
    inputs:
      test:
        description: "1 = test sans rien envoyer"
        default: "0"

permissions:
  contents: write

concurrency:
  group: cta
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Répondre aux commentaires
        env:
          IG_TOKEN_CTA: ${{ secrets.IG_TOKEN_CTA }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ github.event.inputs.test || (github.event_name == 'push' && '1') || '0' }}
        run: python sonde.py; python cta.py
      - name: Sauvegarder l'état
        run: |
          git config user.name "cta-bot"
          git config user.email "cta-bot@users.noreply.github.com"
          git add cta_state.json 2>/dev/null || true
          git commit -m "État robot CTA" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
