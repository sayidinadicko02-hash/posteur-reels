name: Chercheur d'offres de stage

on:
  schedule:
    - cron: "23 * * * *"      # relance de secours ; un passage vérifie LinkedIn toutes les 10 min pendant 5 h 30
  push:
    branches: [main]
    paths: [offres/offres.py, offres/documents.py, .github/workflows/offres.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offres
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: |
          pip install requests beautifulsoup4 playwright
          sudo apt-get install -y fonts-liberation >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Chercher les offres
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CV_TEL: ${{ secrets.CV_TEL }}
          CV_EMAIL: ${{ secrets.CV_EMAIL }}
        run: |
          git config user.name "offres-bot"
          git config user.email "offres-bot@users.noreply.github.com"
          cd offres && python offres.py
