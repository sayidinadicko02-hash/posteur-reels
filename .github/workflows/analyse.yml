name: Analyse du compte

on:
  schedule:
    - cron: "17 6 * * 1"      # audit complet chaque lundi ~8h (Paris)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [analyse/collecte.py, analyse/rapport.py, .github/workflows/analyse.yml]

permissions:
  contents: write

concurrency:
  group: analyse

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: |
          pip install requests playwright
          sudo apt-get install -y ffmpeg fonts-liberation >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Collecter les stats Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: cd analyse && python collecte.py
      - name: Analyser et envoyer le rapport PDF sur Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: cd analyse && python rapport.py
      - name: Chiffrer (le repo est public) et enregistrer
        run: |
          cd analyse
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in data.json -out data.json.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey cle_publique.pem -in k.txt -out k.enc
          rm -f k.txt data.json
          git config user.name "analyse-bot"; git config user.email "analyse-bot@users.noreply.github.com"
          git add data.json.enc k.enc && git commit -qm "Données d'analyse (chiffrées)" && git pull -q --rebase && git push -q
